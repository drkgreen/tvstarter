plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Portföy veri adresi (anahtar dahil). Depoya yazma: CI secret'ı veya yerel
// gradle özelliği olarak ver. Boşsa uygulama adresi ilk açılışta TV'de sorar.
// DİKKAT: APK içine gömülen değer APK'dan çıkarılabilir. Gizli kalmasını
// istiyorsan boş bırak ve adresi uygulamada gir.
def portfolioUrl = System.getenv("PORTFOLIO_URL") ?: (project.findProperty("PORTFOLIO_URL") ?: "")

android {
    namespace 'com.tvstarter'
    compileSdk 34

    defaultConfig {
        applicationId "com.tvstarter"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        buildConfigField "String", "PORTFOLIO_URL", "\"${portfolioUrl}\""
    }

    signingConfigs {
        debug {
            // Sabit debug anahtarı: CI her seferinde taze makinede çalışır.
            // Anahtar sabit değilse her APK farklı imzalanır ve TV'de güncelleme başarısız olur.
            storeFile     file("$rootDir/debug.keystore")
            storePassword "android"
            keyAlias      "androiddebugkey"
            keyPassword   "android"
        }
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath) {
                storeFile     file(ksPath)
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias      System.getenv("KEY_ALIAS")
                keyPassword   System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release anahtarı verilmediyse sabit debug anahtarıyla imzala: APK yine kurulur.
            signingConfig System.getenv("KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }
}

dependencies {
    // Sade ve hızlı kalması bilinçli hedef: leanback gibi ağır TV kütüphanesi yok.
    // Standart View odak sistemi kullanılır.
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Android'e bağımlı olmayan sınıfların birim testleri (logic paketi).
    // Birim testinde android.jar içindeki org.json yalnızca taslaktır; gerçeği ayrıca eklenir.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
